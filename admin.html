<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload - Galeri Al Mursyidul Amin TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex items-center justify-center p-6">

    <!-- LAYAR LOGIN (Tampil Pertama Kali) -->
    <div id="loginScreen" class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center transition-all duration-500">
        <img src="https://raw.githubusercontent.com/hzai18/Galeri-Tasmiyah/refs/heads/main/Logo%20AlmaTV%20copy.png" alt="Logo" class="h-20 mx-auto mb-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Login Admin</h2>
        <p class="text-sm text-gray-500 mb-6">Masukkan kata sandi untuk mengakses panel upload foto.</p>
        
        <input type="password" id="passwordInput" placeholder="Masukkan Password" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-lg mb-4">
        <p id="loginError" class="text-red-500 text-sm hidden mb-4">Password salah! Silakan coba lagi.</p>
        
        <button id="loginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl transition shadow-md">
            Masuk
        </button>
    </div>

    <!-- PANEL UPLOAD (Tersembunyi sampai login berhasil) -->
    <div id="adminPanel" class="w-full max-w-2xl mx-auto space-y-6 hidden transition-all duration-500">
        
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-1">Panel Upload Foto (ImgBB)</h1>
                    <p class="text-gray-500 text-sm">Unggah foto ke ImgBB. Tautan otomatis tersimpan ke Firestore.</p>
                </div>
                <button id="logoutBtn" class="text-red-500 hover:text-red-700 text-sm font-semibold underline">Keluar</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Acara</label>
                    <input type="date" id="dateInput" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Pilih Foto (Bisa banyak sekaligus)</label>
                    <input type="file" id="fileInput" multiple accept="image/*" class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:outline-none">
                </div>

                <button id="uploadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-md">
                    Mulai Upload ke Galeri
                </button>
            </div>

            <!-- Status Progress -->
            <div id="statusArea" class="mt-8 hidden">
                <h3 class="font-semibold text-gray-700 mb-2">Status Upload:</h3>
                <div class="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="statusText" class="text-sm text-gray-600">Menyiapkan file...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Firestore Saja) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ==========================================
        // PENGATURAN PASSWORD ADMIN (GANTI DI SINI)
        // ==========================================
        const KATA_SANDI_ADMIN = "almatv2026";

        // ==========================================
        // 1. FIREBASE CONFIG 
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA25g_miNf3okAtHZHDxIT_tYQzKcZl1fI",
            authDomain: "galeri-almatv.firebaseapp.com",
            projectId: "galeri-almatv",
            storageBucket: "galeri-almatv.firebasestorage.app",
            messagingSenderId: "1018447084967",
            appId: "1:1018447084967:web:b0d705dced1f9ea7a4ca82"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 2. API KEY IMGBB 
        // ==========================================
        const IMGBB_API_KEY = "8ef542627deeb43e5440fa06fd1d452c";

        // --- LOGIKA LOGIN SCREEN ---
        const loginScreen = document.getElementById('loginScreen');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        function prosesLogin() {
            if (passwordInput.value === KATA_SANDI_ADMIN) {
                loginScreen.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                document.body.classList.remove('flex', 'items-center', 'justify-center');
                passwordInput.value = ""; // bersihkan form
                loginError.classList.add('hidden');
            } else {
                loginError.classList.remove('hidden');
            }
        }

        loginBtn.addEventListener('click', prosesLogin);
        
        // Tekan Enter untuk login
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') prosesLogin();
        });

        // Tombol Keluar (Logout)
        logoutBtn.addEventListener('click', () => {
            adminPanel.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.body.classList.add('flex', 'items-center', 'justify-center');
        });


        // --- LOGIKA UPLOAD ---
        const dateInput = document.getElementById('dateInput');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusArea = document.getElementById('statusArea');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        function formatDisplayDate(dateString) {
            const dateObj = new Date(dateString);
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
            return `${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        }

        uploadBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            const dateValue = dateInput.value;

            if (!dateValue) { alert("Pilih tanggal acara!"); return; }
            if (files.length === 0) { alert("Pilih minimal 1 foto!"); return; }

            const displayDate = formatDisplayDate(dateValue);
            
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusArea.classList.remove('hidden');

            let totalFiles = files.length;
            let uploadedFiles = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.innerText = `Mengunggah foto ${i + 1} dari ${totalFiles}...`;

                try {
                    const formData = new FormData();
                    formData.append("image", file);

                    const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    
                    const imgbbResult = await imgbbResponse.json();

                    if (imgbbResult.success) {
                        const directImageUrl = imgbbResult.data.url; 
                        
                        await addDoc(collection(db, "photos"), {
                            tanggal: dateValue,
                            displayDate: displayDate,
                            url: directImageUrl,
                            fileName: file.name,
                            uploadedAt: new Date()
                        });

                        uploadedFiles++;
                        progressBar.style.width = `${(uploadedFiles / totalFiles) * 100}%`;
                    } else {
                        console.error("Gagal upload ke ImgBB:", imgbbResult);
                    }

                } catch (error) {
                    console.error("Error upload file: ", error);
                }
            }

            statusText.innerText = `Selesai! Berhasil mengunggah ${uploadedFiles} foto.`;
            statusText.classList.add('text-green-600', 'font-bold');
            
            fileInput.value = "";
            uploadBtn.disabled = false;
            uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            uploadBtn.innerText = "Upload Foto Lainnya";
        });
    </script>
</body>
</html>
